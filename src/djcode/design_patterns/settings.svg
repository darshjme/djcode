idth="550" height="44" rx="12" fill="#ffffff" stroke="#d3d8df"/><text x="294" y="398" font-family="system-ui,sans-serif" font-size="16" fill="#243449">team@example.invalid</text><rect x="278" y="450" width="160" height="44" rx="8" fill="#234ed8" stroke="#234ed8"/><text x="294" y="478" font-family="system-ui,sans-serif" font-size="15" fill="#ffffff" font-weight="700">Save changes</text><text x="462" y="478" font-family="system-ui,sans-serif" font-size="14" fill="#243449">Unsaved changes</text><text x="40" y="580" font-family="system-ui,sans-serif" font-size="13" fill="#526277">Wireframe only. Implement semantics, keyboard handling and states described in the companion pack.</text></svg>
