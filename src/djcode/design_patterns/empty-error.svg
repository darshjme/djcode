io</text><rect x="366" y="422" width="228" height="44" rx="8" fill="#234ed8" stroke="#234ed8"/><text x="382" y="450" font-family="system-ui,sans-serif" font-size="15" fill="#ffffff" font-weight="700">Clear filters</text><rect x="628" y="184" width="268" height="326" rx="12" fill="#ffffff" stroke="#d3d8df"/><text x="648" y="236" font-family="system-ui,sans-serif" font-size="22" fill="#243449" font-weight="700">Could not load</text><text x="648" y="282" font-family="system-ui,sans-serif" font-size="14" fill="#243449">Saved work is unchanged.</text><text x="648" y="323" font-family="system-ui,sans-serif" font-size="14" fill="#526277">Workspace: Studio</text><rect x="648" y="422" width="228" height="44" rx="8" fill="#234ed8" stroke="#234ed8"/><text x="664" y="450" font-family="system-ui,sans-serif" font-size="15" fill="#ffffff" font-weight="700">Retry</text><text x="40" y="580" font-family="system-ui,sans-serif" font-size="13" fill="#526277">Wireframe only. Implement semantics, keyboard handling and states described in the companion pack.</text></svg>
