<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Original Usage and billing example</title><desc id="desc">Static fictional interface for the DJcode usage-billing design pack. Not an interactive application. Original MIT-licensed artwork.</desc><rect x="0" y="0" width="960" height="600" rx="0" fill="#f4f6f9" stroke="#f4f6f9"/><text x="40" y="48" font-family="system-ui,sans-serif" font-size="15" fill="#526277">DJcode / original design example</text><text x="40" y="90" font-family="system-ui,sans-serif" font-size="30" fill="#243449" font-weight="700">Usage and billing</text><text x="40" y="124" font-family="system-ui,sans-serif" font-size="14" fill="#526277">Fictional interface · illustrative values · MIT</text><rect x="40" y="152" width="880" height="394" rx="12" fill="#ffffff" stroke="#d3d8df"/><text x="64" y="193" font-family="system-ui,sans-serif" font-size="23" fill="#243449" font-weight="700">Studio plan</text><text x="620" y="193" font-family="system-ui,sans-serif" font-size="15" fill="#243449">1–30 September / USD</text><text x="64" y="242" font-family="system-ui,sans-serif" font-size="21" fill="#243449" font-weight="700">42 of 100 included job-hours</text><rect x="64" y="263" width="450" height="18" rx="6" fill="#e8ecf2" stroke="#e8ecf2"/><rect x="64" y="263" width="189" height="18" rx="6" fill="#234ed8" stroke="#234ed8"/><text x="64" y="315" font-family="system-ui,sans-serif" font-size="14" fill="#526277">Usage updated 4 minutes ago</text><rect x="552" y="220" width="344" height="147" rx="12" fill="#edf1f7" stroke="#d3d8df"/><text x="575" y="254" font-family="system-ui,sans-serif" font-size="17" fill="#243449">Estimated next invoice</text><text x="575" y="298" font-family="system-ui,sans-serif" font-size="28" fill="#243449" font-weight="700">USD 24.00</text><text x="575" y="337" font-family="system-ui,sans-serif" font-size="13" fill="#243449">Illustration only / not a price offer</text><path d="M64 397H896" stroke="#d3d8df"/><text x="64" y="433" font-family="system-ui,sans-serif" font-size="17" fill="#243449">Included usage + adjustments + taxes</text><text x="64" y="466" font-family="system-ui,sans-serif" font-size="16" fill="#234ed8">View invoice details</text><rect x="704" y="451" width="192" height="44" rx="8" fill="#234ed8" stroke="#234ed8"/><text x="720" y="479" font-family="system-ui,sans-serif" font-size="15" fill="#ffffff" font-weight="700">Review plan</text><text x="40" y="580" font-family="system-ui,sans-serif" font-size="13" fill="#526277">Wireframe only. Implement semantics, keyboard handling and states described in the companion pack.</text></svg>
