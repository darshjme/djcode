<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Original Onboarding and authentication example</title><desc id="desc">Static fictional interface for the DJcode onboarding-auth design pack. Not an interactive application. Original MIT-licensed artwork.</desc><rect x="0" y="0" width="960" height="600" rx="0" fill="#f4f6f9" stroke="#f4f6f9"/><text x="40" y="48" font-family="system-ui,sans-serif" font-size="15" fill="#526277">DJcode / original design example</text><text x="40" y="90" font-family="system-ui,sans-serif" font-size="30" fill="#243449" font-weight="700">Onboarding and authentication</text><text x="40" y="124" font-family="system-ui,sans-serif" font-size="14" fill="#526277">Fictional interface · illustrative values · MIT</text><rect x="40" y="152" width="880" height="394" rx="12" fill="#ffffff" stroke="#d3d8df"/><text x="72" y="193" font-family="system-ui,sans-serif" font-size="17" fill="#234ed8" font-weight="700">1 Choose service   →   2 Connect   →   3 Verify</text><text x="72" y="243" font-family="system-ui,sans-serif" font-size="25" fill="#243449" font-weight="700">Connect your workspace</text><text x="72" y="280" font-family="system-ui,sans-serif" font-size="16" fill="#243449">Continue at the service shown below. Keep this page open.</text><rect x="72" y="304" width="504" height="97" rx="12" fill="#edf1f7" stroke="#d3d8df"/><text x="92" y="338" font-family="system-ui,sans-serif" font-size="16" fill="#243449">https://service.example.invalid/device</text><text x="92" y="376" font-family="system-ui,sans-serif" font-size="25" fill="#243449" font-weight="700">DEMO - 4821</text><text x="620" y="338" font-family="system-ui,sans-serif" font-size="17" fill="#243449" font-weight="700">Requested access</text><text x="620" y="369" font-family="system-ui,sans-serif" font-size="15" fill="#243449">Read project metadata</text><text x="72" y="437" font-family="system-ui,sans-serif" font-size="16" fill="#243449">Waiting for your approval. Expires in 5 minutes.</text><rect x="72" y="466" width="145" height="44" rx="8" fill="#234ed8" stroke="#234ed8"/><text x="88" y="494" font-family="system-ui,sans-serif" font-size="15" fill="#ffffff" font-weight="700">Copy code</text><text x="250" y="494" font-family="system-ui,sans-serif" font-size="16" fill="#234ed8">Cancel</text><text x="40" y="580" font-family="system-ui,sans-serif" font-size="13" fill="#526277">Wireframe only. Implement semantics, keyboard handling and states described in the companion pack.</text></svg>
