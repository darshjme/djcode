<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Original Command palette example</title><desc id="desc">Static fictional interface for the DJcode command-palette design pack. Not an interactive application. Original MIT-licensed artwork.</desc><rect x="0" y="0" width="960" height="600" rx="0" fill="#f4f6f9" stroke="#f4f6f9"/><text x="40" y="48" font-family="system-ui,sans-serif" font-size="15" fill="#526277">DJcode / original design example</text><text x="40" y="90" font-family="system-ui,sans-serif" font-size="30" fill="#243449" font-weight="700">Command palette</text><text x="40" y="124" font-family="system-ui,sans-serif" font-size="14" fill="#526277">Fictional interface · illustrative values · MIT</text><rect x="40" y="152" width="880" height="394" rx="12" fill="#ffffff" stroke="#d3d8df"/><rect x="132" y="183" width="696" height="312" rx="12" fill="#ffffff" stroke="#a8b7d0"/><text x="158" y="219" font-family="system-ui,sans-serif" font-size="18" fill="#243449" font-weight="700">Commands</text><text x="730" y="219" font-family="system-ui,sans-serif" font-size="14" fill="#243449">Esc</text><rect x="156" y="234" width="648" height="47" rx="12" fill="#f4f6f9" stroke="#d3d8df"/><text x="176" y="263" font-family="system-ui,sans-serif" font-size="16" fill="#243449">branch</text><rect x="156" y="293" width="648" height="53" rx="6" fill="#e8efff" stroke="#234ed8"/><text x="176" y="326" font-family="system-ui,sans-serif" font-size="17" fill="#234ed8" font-weight="700">Create branch</text><text x="612" y="326" font-family="system-ui,sans-serif" font-size="14" fill="#243449">Selected / Enter</text><text x="176" y="379" font-family="system-ui,sans-serif" font-size="16" fill="#243449">Switch branch</text><text x="176" y="426" font-family="system-ui,sans-serif" font-size="16" fill="#243449">Compare branches</text><text x="156" y="473" font-family="system-ui,sans-serif" font-size="14" fill="#526277">↑ ↓ select     Enter run     Esc close</text><text x="40" y="580" font-family="system-ui,sans-serif" font-size="13" fill="#526277">Wireframe only. Implement semantics, keyboard handling and states described in the companion pack.</text></svg>
