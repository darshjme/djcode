[project]
name = "djcode"
version = "4.3.0"
description = "DJcode — local-first coding agent with specialist profiles, tool approvals and recoverable sessions."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Darshankumar Joshi", email = "darsh@darshj.ai" },
]
keywords = ["ai", "cli", "coding", "ollama", "local-first", "agent", "apple-silicon", "multi-agent", "parallel", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "click>=8.1",
    "rich>=13.7",
    "ruff>=0.9",
    "httpx>=0.27",
    "prompt-toolkit>=3.0",
    "chromadb>=1.5.6",
    "questionary>=2.1.1",
    "textual>=8.2.3",
]

[project.optional-dependencies]
computer = ["playwright>=1.49", "pyautogui>=0.9.54", "pillow>=10"]
voice = ["sounddevice>=0.4"]
tokens = ["tiktoken>=0.7"]

[project.scripts]
djcode = "djcode.cli:main"
djcode-colibri = "djcode.colibri:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
# The release gate (scripts/publish_update.py) runs `pytest -q` from the repo
# root. Without testpaths that also collects scripts/test_release_helpers.py,
# whose POSIX-only install fixtures error on Windows before any real test runs.
testpaths = ["tests"]
addopts = "-q"
# "coroutine ... was never awaited" is the exact symptom of calling a
# sync-wrapped asyncio.run() helper from inside a running loop. Make it fail
# the suite instead of scrolling past on stderr.
filterwarnings = ["error::RuntimeWarning:djcode.*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/djcode"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
